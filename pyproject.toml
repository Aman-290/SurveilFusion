[project]
name = "surveilfusion"
version = "0.2.0"
description = "Local-first AI surveillance platform for existing CCTV, incident memory, and agentic automation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Aman-290" }]
keywords = [
  "ai-surveillance",
  "cctv",
  "rtsp",
  "onvif",
  "edge-ai",
  "home-assistant",
  "local-ai",
  "computer-vision",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pyyaml>=6.0.2",
  "aiosqlite>=0.20.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
vision = [
  "opencv-python-headless>=4.10.0",
  "ultralytics>=8.3.0",
]
agents = [
  "openai>=1.80.0",
  "qdrant-client>=1.12.0",
]
integrations = [
  "gmqtt>=0.6.16",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
surveilfusion = "surveilfusion.api.app:main"

[tool.setuptools.packages.find]
include = ["surveilfusion*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
